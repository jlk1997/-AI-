# Dual-launch edge for Gebi / 隔壁.
# Set $PLATFORM_API_ORIGIN and the web root before include.

upstream opengame_api {
    server api:3847;
}

server {
    listen 80;
    server_name _;
    root /var/www/gebi;
    index index.html;

    location = /health {
        proxy_pass http://opengame_api/health;
    }

    location = /readyz {
        proxy_pass http://opengame_api/readyz;
    }

    location ~ ^/play/([^/?#]+) {
        if ($http_user_agent ~* (MicroMessenger|Weibo|Slackbot|facebookexternalhit|Twitterbot|Discordbot|TelegramBot|LinkedInBot|WhatsApp)) {
            proxy_pass http://opengame_api/v1/public/games/$1/share.html;
            break;
        }
        try_files $uri /index.html;
    }

    location /v1/ {
        proxy_pass http://opengame_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    location /api/public/ {
        proxy_pass http://opengame_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
